name: Zdrowie Android

# Aplikacja „GYM TRACKER Zdrowie” na Androida (health/android): testy i APK do sprawdzenia przy każdej
# zmianie, a na tagu zdrowie-android-v1.2.3 podpisany APK w wydaniu na GitHubie.
on:
  push:
    # Bez `branches` GitHub pomija zwykłe pushe, gdy jest filtr `tags`.
    branches: ['**']
    tags: ['zdrowie-android-v*']
    paths:
      - 'health/android/**'
      - 'health/vectors.json'
      - '.github/workflows/zdrowie-android.yml'
  pull_request:
    paths:
      - 'health/android/**'
      - 'health/vectors.json'
      - '.github/workflows/zdrowie-android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zdrowie-android-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: health/android

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Sprawdza też, czy gradle-wrapper.jar to prawdziwy wrapper Gradle.
      - uses: gradle/actions/setup-gradle@v4

      # Testy czytają wspólny wektor koperty z health/vectors.json.
      - name: Testy i APK debug
        run: ./gradlew testDebugUnitTest assembleDebug --no-daemon

      - name: Raport testów
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: zdrowie-android-testy
          path: health/android/app/build/reports/tests/
          retention-days: 7

      - name: APK debug
        uses: actions/upload-artifact@v4
        with:
          name: zdrowie-android-debug
          path: health/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  release:
    if: startsWith(github.ref, 'refs/tags/zdrowie-android-v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # Nazwa tagu przez zmienną, nie wklejona w skrypt: tak nie da się nią przemycić polecenia.
      - name: Wersja z tagu
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#zdrowie-android-v}"
          if [[ ! "$version" =~ ^[0-9]{1,2}\.[0-9]{1,2}\.[0-9]{1,2}$ ]]; then
            echo "::error::Tag ma wyglądać jak zdrowie-android-v1.2.3 (liczby do 99), jest: $TAG"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Bez sekretów powstaje niepodpisany APK jako artefakt, bez wydania — takiego APK
      # Android nie zainstaluje, ale build jest sprawdzony.
      - name: Klucz podpisu z sekretów
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::warning::Brak sekretów podpisu (ANDROID_KEYSTORE_B64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD) — APK będzie niepodpisany, bez wydania."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          else
            printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: APK release
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --no-daemon -Pzdrowie.version="$VERSION"
          mkdir -p dist
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            # Stała nazwa: link …/releases/latest/download/gym-tracker-zdrowie.apk w karcie aplikacji
            # zawsze pobiera najnowszą wersję, a numer wersji stoi w tytule wydania.
            cp app/build/outputs/apk/release/app-release.apk dist/gym-tracker-zdrowie.apk
          else
            cp app/build/outputs/apk/release/app-release-unsigned.apk "dist/gym-tracker-zdrowie-$VERSION-unsigned.apk"
          fi
          rm -f "$RUNNER_TEMP/release.keystore"

      - name: Wydanie na GitHubie
        if: steps.keystore.outputs.signed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: GYM TRACKER Zdrowie ${{ steps.version.outputs.version }} (Android)
          files: health/android/dist/gym-tracker-zdrowie.apk
          body: |
            Aplikacja towarzysząca GYM TRACKER: wysyła kroki, tętno, sen, wagę i przejazdy rowerem
            z Health Connect, zaszyfrowane kluczem z GYM TRACKER. Instalacja: pobierz APK na telefonie
            z Androidem 9 lub nowszym i otwórz (trzeba zezwolić na instalację z tego źródła).

      - name: Niepodpisany APK
        if: steps.keystore.outputs.signed != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: zdrowie-android-unsigned
          path: health/android/dist/
          retention-days: 7
