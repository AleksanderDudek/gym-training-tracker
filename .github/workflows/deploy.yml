name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Uprawnienia wymagane przez deploy-pages: publikacja strony i token OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# Jedno wdrożenie naraz. Trwających nie przerywamy, żeby nie zostawić strony w połowie.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Wdrożenie idzie dopiero po typach, lincie (błędy zatrzymują, ostrzeżenia nie) i testach.
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # Serwer aplikacji (server/api — przypomnienia i uwagi): adres i klucz publiczny VAPID ze
      # zmiennych repozytorium (Settings → Secrets and variables → Actions → Variables).
      # Puste — aplikacja bez przypomnień i bez formularza uwag. Adres aplikacji na zegarek
      # w Connect IQ Store włącza kartę „Zegarek Garmin” (garmin/README.md), a adresy aplikacji
      # GYM TRACKER Zdrowie (App Store/TestFlight, APK albo Google Play) — kartę „Zdrowie
      # z telefonu” (health/README.md).
      - run: npm run build
        env:
          VITE_API_URL: ${{ vars.API_URL }}
          VITE_VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}
          VITE_GARMIN_APP_URL: ${{ vars.GARMIN_APP_URL }}
          VITE_HEALTH_IOS_URL: ${{ vars.HEALTH_IOS_URL }}
          VITE_HEALTH_ANDROID_URL: ${{ vars.HEALTH_ANDROID_URL }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
