# Serwer aplikacji GYM TRACKER — przypomnienia push i uwagi od użytkowników.
# Cloudflare Worker z cronem i bazą D1. Sekrety: VAPID_PRIVATE_JWK i ADMIN_TOKEN (hasło do listy uwag).
# Wdrożenie krok po kroku: README.md w tym katalogu.
name = "gym-tracker-api"
main = "worker.ts"
compatibility_date = "2026-10-01"

# Co pięć minut: przypomnienie wychodzi najpóźniej kilka minut po swojej godzinie.
[triggers]
crons = ["*/5 * * * *"]

[vars]
# Klucz publiczny VAPID — wpisuje go `node keys.mjs`. Prywatny idzie do sekretów, nie tutaj.
VAPID_PUBLIC_KEY = "BLyuW4cE9mrvjqjWNHDXVWM8Fti5Pk6iYleqDxD1Sc-PCHUHu9P6NFqnyT2pI3cKOk6bJe10jo2GbqXmE3MIGQs"
VAPID_SUBJECT = "https://aleksanderdudek.github.io/gym-training-tracker/"
ALLOWED_ORIGINS = "https://aleksanderdudek.github.io,http://localhost:5173,http://localhost:4173"

[[d1_databases]]
binding = "DB"
database_name = "gym-tracker-api"
# Identyfikator z `npx wrangler d1 create gym-tracker-api`.
database_id = "9a18aa6c-4886-40b6-8941-feb1c1ce8d4d"
