# Projekt Xcode dla XcodeGen: `xcodegen generate` tworzy GymTrackerZdrowie.xcodeproj, Info.plist
# i plik uprawnień. Źródłem prawdy jest ten plik — wygenerowanych nie ma w gicie (.gitignore).

name: GymTrackerZdrowie

options:
  bundleIdPrefix: io.github.aleksanderdudek.gymtracker
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: pl
  createIntermediateGroups: true

settings:
  base:
    # Twój Team ID (developer.apple.com → Account → Membership). Bez niego Xcode nie podpisze
    # aplikacji z HealthKit. Można też wybrać zespół w Xcode: Signing & Capabilities → Team.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Tryb Swift 5 z pełnym sprawdzaniem współbieżności: kod jest czysty także w trybie 6
    # (`./check.sh --app`), ale zmiana adnotacji w nowym SDK da tu ostrzeżenie, a nie zepsuty build.
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  GymTrackerZdrowie:
    type: application
    platform: iOS
    sources:
      - path: GymTrackerZdrowie
    info:
      path: GymTrackerZdrowie/Info.plist
      properties:
        CFBundleDisplayName: GYM TRACKER Zdrowie
        CFBundleDevelopmentRegion: pl
        # Jedyny język aplikacji — także przyciski systemowe (np. „Wklej”) będą po polsku.
        CFBundleLocalizations: [pl]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.healthcare-fitness
        LSRequiresIPhoneOS: true
        # Adres serwera z ustawienia buildu API_URL (niżej); Sender.swift ma ten sam jako zapas.
        API_URL: $(API_URL)
        NSHealthShareUsageDescription: >-
          GYM TRACKER Zdrowie czyta z ostatnich 14 dni kroki, dystans, piętra, minuty ćwiczeń, tętno,
          tętno spoczynkowe, sen, wagę i przejazdy rowerem, żeby pokazać je w GYM TRACKER. Dane
          opuszczają telefon tylko zaszyfrowane Twoim kluczem z GYM TRACKER — serwer ich nie odczyta.
        BGTaskSchedulerPermittedIdentifiers:
          - io.github.aleksanderdudek.gymtracker.zdrowie.sync
        UIBackgroundModes: [fetch]
        # Szyfrowanie tylko systemowe (CommonCrypto, CryptoKit, HTTPS) i tylko do ochrony danych
        # użytkownika — zwolnione z dokumentów eksportowych. Uzasadnienie: README.md.
        ITSAppUsesNonExemptEncryption: false
        UIRequiredDeviceCapabilities: [healthkit]
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    entitlements:
      path: GymTrackerZdrowie/GymTrackerZdrowie.entitlements
      properties:
        com.apple.developer.healthkit: true
        # Pusta lista: bez dokumentacji medycznej (Health Records).
        com.apple.developer.healthkit.access: []
        com.apple.developer.healthkit.background-delivery: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.aleksanderdudek.gymtracker.zdrowie
        PRODUCT_NAME: GymTrackerZdrowie
        API_URL: https://gym-tracker-api.instrukcje-app.workers.dev
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Tylko iPhone: tam jest Zdrowie z krokami i snem. Bez wersji na Maca — Mac nie ma Zdrowia.
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO

  GymTrackerZdrowieTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: GymTrackerZdrowieTests
      # Wspólny wektor koperty — ten sam czytają testy aplikacji i Androida.
      - path: ../vectors.json
        buildPhase: resources
    dependencies:
      - target: GymTrackerZdrowie
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.aleksanderdudek.gymtracker.zdrowie.tests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"

schemes:
  GymTrackerZdrowie:
    build:
      targets:
        GymTrackerZdrowie: all
        GymTrackerZdrowieTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - GymTrackerZdrowieTests
    archive:
      config: Release
